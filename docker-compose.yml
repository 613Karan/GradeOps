services:

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: gradeops
      POSTGRES_USER: gradeops
      POSTGRES_PASSWORD: gradeops
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gradeops"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile.dev
    ports:
      - "8000:8000"
    env_file: .env
    volumes:
      - ./uploads:/app/uploads
      - .:/app
      - fastembed_cache:/root/.cache/fastembed
    depends_on:
      postgres:
        condition: service_healthy
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

volumes:
  postgres_data:
  fastembed_cache:
